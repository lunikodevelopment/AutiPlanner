name: TypeScript and Python

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version` here: pnpm/action-setup reads `packageManager` from
      # package.json. Specifying both fails with "Multiple versions of pnpm
      # specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The store, ICS, recurrence, command, API, path, and pairing modules have
      # no Home Assistant dependency, so these run without installing it.
      - run: python -m unittest discover -s tests -t .
