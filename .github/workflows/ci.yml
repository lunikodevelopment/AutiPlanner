name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catches a source file being silently excluded by .gitignore, which once
      # hid the Android app's whole `data` package from the repository.
      - run: ./tools/check-ignored-sources.sh

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version` here: pnpm/action-setup reads `packageManager` from
      # package.json. Specifying both fails with "Multiple versions of pnpm
      # specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The store, ICS, recurrence, command, API, path, and pairing modules have
      # no Home Assistant dependency, so these run without installing it.
      - run: python -m unittest discover -s tests -t .

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      # Loads the integration the way Home Assistant does. This is the job that
      # catches invented APIs: an unknown symbol used at import time, a missing
      # entity platform, or an unregistered HTTP route all fail here.
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests_ha -q

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub's runner image already provides the Android SDK, so no setup
      # action is needed. `android-actions/setup-android` was removed because it
      # runs sdkmanager for the legacy `tools` package, which no longer exists
      # and failed the job before Gradle ever ran.
      - name: Point Gradle at the preinstalled SDK
        run: echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      # Compiling from a clean checkout is what proves every source file is
      # published. The app previously could not build because its `data`
      # package was excluded from the repository.
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
        working-directory: apps/android
