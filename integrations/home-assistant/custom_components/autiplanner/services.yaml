complete:
  name: Complete routine
  description: Mark one routine item as completed.
  target:
    entity:
      domain: todo
      integration: autiplanner
  fields:
    uid:
      name: UID
      description: Stable UID of the routine item.
      required: true
      selector:
        text:
    completed_at:
      name: Completed at
      description: Optional completion timestamp; defaults to now.
      required: false
      selector:
        datetime:

mark_missed:
  name: Mark routine missed
  description: Mark one routine item as missed.
  target:
    entity:
      domain: todo
      integration: autiplanner
  fields:
    uid:
      name: UID
      description: Stable UID of the routine item.
      required: true
      selector:
        text:

skip:
  name: Skip routine
  description: Mark one routine item as intentionally skipped.
  target:
    entity:
      domain: todo
      integration: autiplanner
  fields:
    uid:
      name: UID
      description: Stable UID of the routine item.
      required: true
      selector:
        text:

reset:
  name: Reset routine
  description: Reset one routine item to pending.
  target:
    entity:
      domain: todo
      integration: autiplanner
  fields:
    uid:
      name: UID
      description: Stable UID of the routine item.
      required: true
      selector:
        text:

add_routine:
  name: Add routine
  description: Add a routine with an explicit date, day part, and optional icon-font token.
  target:
    entity:
      domain: todo
      integration: autiplanner
  fields:
    title:
      name: Title
      description: Routine title.
      required: true
      selector:
        text:
    date:
      name: Date
      description: Local calendar date in YYYY-MM-DD format.
      required: true
      selector:
        date:
    day_part:
      name: Day part
      description: Explicit period for the routine.
      required: false
      selector:
        select:
          options:
            - morning
            - afternoon
            - evening
            - night
    description:
      name: Description
      required: false
      selector:
        text:
          multiline: true
    icon:
      name: Icon token
      description: Icon-font token such as mdi:coffee, fa:coffee, or a Unicode glyph.
      required: false
      selector:
        text:
    priority:
      name: Priority
      description: Green must do, yellow preferably, or red optional/avoid if needed.
      required: false
      selector:
        select:
          options:
            - must_do
            - preferably
            - optional

update_routine:
  name: Update routine
  description: Update a routine's date, period, text, or icon without changing its UID.
  target:
    entity:
      domain: todo
      integration: autiplanner
  fields:
    uid:
      name: UID
      description: Stable UID of the routine item.
      required: true
      selector:
        text:
    title:
      name: Title
      required: false
      selector:
        text:
    date:
      name: Date
      required: false
      selector:
        date:
    day_part:
      name: Day part
      required: false
      selector:
        select:
          options:
            - morning
            - afternoon
            - evening
            - night
    description:
      name: Description
      required: false
      selector:
        text:
          multiline: true
    icon:
      name: Icon token
      required: false
      selector:
        text:
    priority:
      name: Priority
      description: Green must do, yellow preferably, or red optional/avoid if needed.
      required: false
      selector:
        select:
          options:
            - must_do
            - preferably
            - optional
